name: Build Nginx Proxy Manager

on:
  workflow_dispatch:
    inputs:
      skip_base:
        description: 'Skip building docker-nginx-full base (use previously built image in GHCR)'
        type: boolean
        default: false
      skip_npm:
        description: 'Skip building nginx-proxy-manager image (only build base)'
        type: boolean
        default: false
      base_repo:
        description: 'Primary repository for docker-nginx-full'
        required: false
        default: 'NginxProxyManager/docker-nginx-full'
      base_ref:
        description: 'Default git ref/branch for docker-nginx-full'
        required: false
        default: 'master'
      base_var_name:
        description: 'Variable name to verify in base repository'
        required: false
        default: 'OPENRESTY_VERSION'
      base_var_file:
        description: 'Target file containing the variable (leave empty to search full history)'
        required: false
        default: 'Jenkinsfile'
      base_min_version:
        description: 'Minimum required semantic version for the variable'
        required: false
        default: '1.31.8.1'
      base_alt_repo:
        description: 'Alternative repository if version check fails (optional; defaults to base_repo)'
        required: false
        default: ''
      base_alt_ref:
        description: 'Alternative git ref/PR if version check fails'
        required: false
        default: 'refs/pull/41/head'
      npm_ref:
        description: 'Git ref/branch for nginx-proxy-manager'
        required: false
        default: 'master'
  push:
    branches:
      - main

jobs:
  # =============================================================
  # Job 1: Build Base Image (docker-nginx-full)
  # =============================================================
  build-base:
    name: "Build Base: docker-nginx-full"
    if: ${{ !inputs.skip_base }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute Lowercase Repo Owner
        id: prep
        run: |
          echo "owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout docker-nginx-full
        uses: actions/checkout@v4
        with:
          repository: NginxProxyManager/docker-nginx-full
          ref: ${{ github.event.inputs.base_ref }}
          path: docker-nginx-full

      # -------------------------------------------------------------
      # Ensure
      # -------------------------------------------------------------

      - name: Resolve Source Ref & Fallback
        id: version-check
        uses: ./.github/actions/version-check
        with:
          target-dir: docker-nginx-full
          default-repo: ${{ github.event.inputs.base_repo || 'NginxProxyManager/docker-nginx-full' }}
          default-ref: ${{ github.event.inputs.base_ref || 'master' }}
          alt-repo: ${{ github.event.inputs.base_alt_repo }}
          alt-ref: ${{ github.event.inputs.base_alt_ref }}
          var-name: ${{ github.event.inputs.base_var_name }}
          var-file: ${{ github.event.inputs.base_var_file }}
          min-version: ${{ github.event.inputs.base_min_version }}

      - name: Checkout Fallback Source
        if: steps.version-check.outputs.needs-fallback == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.version-check.outputs.target-repo }}
          ref: ${{ steps.version-check.outputs.target-ref }}
          path: docker-nginx-full
          clean: true
      # -------------------------------------------------------------
      # Build
      # -------------------------------------------------------------

      - name: Bake and Push docker-nginx-full
        working-directory: ./docker-nginx-full
        env:
          OWNER_LC: ${{ steps.prep.outputs.owner_lc }}
        run: |
          chmod +x scripts/bake.sh

          # Replace upstream namespace with lowercase GHCR registry path
          sed -i "s|nginxproxymanager/nginx-full|ghcr.io/${OWNER_LC}/nginx-full|g" docker/docker-bake.hcl

          # Verify replacement succeeded
          grep "ghcr.io/${OWNER_LC}/nginx-full" docker/docker-bake.hcl

          # Build and push add targets
          ./scripts/bake.sh --push

  # =============================================================
  # Job 2: Build Nginx Proxy Manager (Runs even if Base fails/skips)
  # =============================================================
  build-npm:
    name: Build Nginx Proxy Manager
    needs: [build-base]
    if: ${{ !inputs.skip_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute Lowercase Repo Owner
        id: prep
        run: |
          echo "owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout nginx-proxy-manager
        uses: actions/checkout@v4
        with:
          repository: NginxProxyManager/nginx-proxy-manager
          ref: ${{ github.event.inputs.npm_ref || 'master' }}
          path: nginx-proxy-manager

      - name: Build Frontend and Backend
        working-directory: ./nginx-proxy-manager
        run: |
          chmod +x scripts/ci/frontend-build scripts/ci/test-and-build
          ./scripts/ci/frontend-build
          ./scripts/ci/test-and-build

      - name: Buildx and Push nginx-proxy-manager
        if: ${{ !inputs.skip_npm }}
        working-directory: ./nginx-proxy-manager
        env:
          OWNER_LC: ${{ steps.prep.outputs.owner_lc }}
        run: |
          chmod +x scripts/buildx

          # Point base image in Dockerfile to your custom certbot-node image
          sed -i "s|nginxproxymanager/nginx-full:certbot-node|ghcr.io/${OWNER_LC}/nginx-full:certbot-node|g" docker/Dockerfile

          # Verify replacement succeeded
          grep "ghcr.io/${OWNER_LC}/nginx-full:certbot-node" docker/Dockerfile

          # Build and push final images
          ./scripts/buildx --push \
            -t "ghcr.io/${OWNER_LC}/nginx-proxy-manager:latest"
